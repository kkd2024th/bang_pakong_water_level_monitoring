<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ระบบติดตามระดับน้ำสถานีบางปะกง</title>
		<script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
		<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
		<style> body { font-family: 'Sarabun', sans-serif; } </style>
	</head>
	<body class="bg-gray-100 flex items-center justify-center min-h-screen">

		<div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full mx-4">
			<h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">🌊 ระดับน้ำบางปะกง</h1>
			<p class="text-sm text-gray-500 text-center mb-6">คลังข้อมูลน้ำแห่งชาติ (HII)</p>

			<div id="loading" class="text-center py-8 text-gray-400">กำลังโหลดข้อมูล...</div>

			<div id="content" class="hidden space-y-4">
				<div class="p-4 rounded-xl bg-gray-50 border border-gray-100 space-y-2">
					<div class="flex justify-between text-sm text-gray-600">
						<span>สถานีวัด:</span>
						<span id="stationName" class="font-semibold text-gray-800">-</span>
					</div>
					<div class="flex justify-between text-sm text-gray-600">
						<span>ระดับน้ำปัจจุบัน:</span>
						<span id="waterLevel" class="font-semibold text-gray-800">-</span>
					</div>
					<div class="flex justify-between text-sm text-gray-600">
						<span>ระดับตลิ่ง:</span>
						<span id="bankLevel" class="font-semibold text-gray-800">-</span>
					</div>
					<div class="flex justify-between text-sm text-gray-600">
						<span>ระยะห่างจากตลิ่ง:</span>
						<span id="diffCm" class="font-bold">-</span>
					</div>
				</div>

				<div id="alertBox" class="p-4 rounded-xl text-center font-semibold text-sm hidden"></div>
			</div>

			<div id="errorBox" class="hidden p-4 rounded-xl text-center text-sm bg-red-50 text-red-600 border border-red-100 mb-4">
				ไม่สามารถดึงข้อมูลได้ กรุณาลองใหม่อีกครั้ง
			</div>

			<button onclick="fetchWaterData()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-200">
				🔄 รีเฟรชข้อมูล
			</button>
		</div>

		<script>
			// ใส่ Google Apps Script Web App URL ของคุณที่นี่ (ที่ลงท้ายด้วย /exec)
			const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzpuQmf_jftoSqCfbp87v3_c48JNC-veSTG4sp0OJiMBDJD6SjrDUKG8ing3Ie6nuP3eQ/exec';

			async function fetchWaterData() {
				document.getElementById('loading').classList.remove('hidden');
				document.getElementById('content').classList.add('hidden');
				document.getElementById('errorBox').classList.add('hidden');

				try {
					const response = await fetch(GAS_WEB_APP_URL);
					const data = await response.json();

					if (data.status === 'success') {
						document.getElementById('stationName').innerText = data.station_name;
						document.getElementById('waterLevel').innerText = data.water_level + ' เมตร';
						document.getElementById('bankLevel').innerText = data.bank_left + ' เมตร';
						
						let diffElement = document.getElementById('diffCm');
						diffElement.innerText = data.diff_cm + ' ซม.';

						let alertBox = document.getElementById('alertBox');
						alertBox.classList.remove('hidden');

						if (data.is_alert) {
							alertBox.className = "p-4 rounded-xl text-center font-semibold text-sm bg-red-100 text-red-700 border border-red-200";
							alertBox.innerText = "🚨 วิกฤต: น้ำใกล้ล้นตลิ่งหรือล้นตลิ่งแล้ว!";
							diffElement.className = "font-bold text-red-600";
						} else {
							alertBox.className = "p-4 rounded-xl text-center font-semibold text-sm bg-green-100 text-green-700 border border-green-200";
							alertBox.innerText = "✅ สถานการณ์ปกติ";
							diffElement.className = "font-bold text-green-600";
						}

						document.getElementById('loading').classList.add('hidden');
						document.getElementById('content').classList.remove('hidden');
					} else {
						throw new Error(data.message || 'Error');
					}

				} catch (error) {
					console.error(error);
					document.getElementById('loading').classList.add('hidden');
					document.getElementById('errorBox').classList.remove('hidden');
				}
			}

			fetchWaterData();
		</script>
	</body>
</html>
